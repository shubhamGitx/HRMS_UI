<div class="topbar-container">
  <div class="topbar-content">
    
    <!-- Left Side: Contact Info -->
    <div class="topbar-left">
      <a routerLink="/" class="contact-item" aria-label="Bihar Rural Development Society home">
        <i> <img src="/assets/images/b-logo.png" class="icon-logo"> </i>
        <span>{{ language.t('Bihar Rural Development Society') }}</span>
      </a>
    </div>

    <!-- Right Side: Accessibility & Language Switcher -->
    <div class="topbar-right">
      
      <!-- Language Switcher Pills -->
      <div class="lang-switch-pills" role="group" aria-label="Language selection">
        <button type="button" class="lang-pill" [class.active]="language.langCode() === 1" (click)="language.setLanguage(1)">EN</button>
        <button type="button" class="lang-pill" [class.active]="language.langCode() === 2" (click)="language.setLanguage(2)">हिन्दी</button>
      </div>

      <!-- Accessibility Menu Wrapper -->
      <div class="dropdown-wrapper">
        <button class="modern-btn" (click)="toggleAccessibility()" aria-label="Accessibility Options">
          <i class="pi pi-eye"></i>
          <span class="btn-text">{{ language.t('Accessibility') }}</span>
          <i class="pi pi-angle-down chevron" [class.rotate]="isAccessibilityOpen"></i>
        </button>

        <!-- Smooth Animated Dropdown -->
        <div class="dropdown-menu" [class.show]="isAccessibilityOpen">
          <div class="dropdown-header">{{ language.t('Font Size') }}</div>
          <div class="dropdown-group">
            <button (click)="setFontSize('normal')" [class.active]="currentFontSize === 'normal'">A</button>
            <button (click)="setFontSize('large')" [class.active]="currentFontSize === 'large'">A+</button>
            <button (click)="setFontSize('xlarge')" [class.active]="currentFontSize === 'xlarge'">A++</button>
          </div>
          
          <div class="dropdown-divider"></div>
          
          <div class="dropdown-header">{{ language.t('Theme Mode') }}</div>
          <div class="dropdown-group">
            <button (click)="setTheme('light')" [class.active]="currentTheme === 'light'">
              <i class="pi pi-sun"></i> {{ language.t('Light') }}
            </button>
            <button (click)="setTheme('dark')" [class.active]="currentTheme === 'dark'">
              <i class="pi pi-moon"></i> {{ language.t('Dark') }}
            </button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<div class="hrms-dashboard-layout">
  <div class="hrms-main-wrapper">
    <header class="hrms-topbar">
      <div class="topbar-left"></div>
      <div class="topbar-right">
        <div class="topbar-datetime"><i class="bi bi-calendar3 me-1"></i> {{ currentDateTime }}</div>
        <div class="topbar-divider"></div>
        <div class="topbar-profile" (click)="$event.stopPropagation()">
          <div class="profile-trigger" (click)="toggleProfileMenu($event)">
            <div class="profile-avatar-circle admin-avatar">
              <svg viewBox="0 0 64 64" width="36" height="36" class="avatar-svg">
                <circle cx="32" cy="32" r="32" fill="#e2e8f0"/>
                <circle cx="32" cy="24" r="13" fill="#1e293b"/>
                <circle cx="32" cy="25" r="10" fill="#fcd34d"/>
                <path d="M22 24c0-5 4-9 10-9s10 4 10 9c0 1-1 2-2 2h-16c-1 0-2-1-2-2z" fill="#0f172a"/>
                <path d="M14 58c0-10 8-18 18-18s18 8 18 18z" fill="#1e293b"/>
                <polygon points="32,40 27,50 32,58 37,50" fill="#ffffff"/>
                <polygon points="32,44 30,50 32,56 34,50" fill="#0284c7"/>
              </svg>
            </div>
            <div class="profile-info"><span class="profile-name">{{ user?.userName || user?.userId }}</span><span class="profile-role">Maker (SMAKER)</span></div>
            <i class="bi bi-chevron-down profile-chevron"></i>
          </div>
          <div class="profile-dropdown-menu" [class.show]="profileMenuOpen">
            <div class="dropdown-user-header">
              <div class="dropdown-name-row"><strong class="dropdown-name">{{ user?.userName }}</strong><span class="dropdown-emp-badge"><i class="bi bi-person-badge"></i> {{ user?.userId }}</span></div>
              <div class="dropdown-designation-row"><i class="bi bi-briefcase"></i><span>Maker (SMAKER)</span></div>
            </div>
            <div class="dropdown-divider"></div>
            <a class="dropdown-link logout-link" (click)="onLogout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
          </div>
        </div>
      </div>
    </header>
    <main class="hrms-content-area"></main>
  </div>
</div>
